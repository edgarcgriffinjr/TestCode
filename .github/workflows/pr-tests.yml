name: Playwright Tests on PR

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Checkout Test Repository
        uses: actions/checkout@v4
        with:
          repository: edgarcgriffinjr/TestCode_Testing
          path: test-repo

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Maven
        run: apt-get update && apt-get install -y maven

      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: Start Spring Boot Application
        run: |
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 1; done'

      - name: Run Playwright tests
        working-directory: ./test-repo
        run: mvn clean test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: test-repo/target/surefire-reports/
          retention-days: 7
