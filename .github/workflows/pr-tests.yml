name: Playwright Tests on PR

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: Checkout Test Repository
        uses: actions/checkout@v4
        with:
          repository: edgarcgriffinjr/TestCode_Testing
          path: test-repo

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: Start Spring Boot Application
        run: |
          nohup java -jar target/demo-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 1; done'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright and dependencies
        working-directory: ./test-repo
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./test-repo
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-repo/playwright-report/
          retention-days: 7
